<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銀河車旅</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
  font-family:Arial,"Microsoft JhengHei";
  background:#f5f6f7;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

.box{
  background:#fff;
  padding:40px;
  border-radius:18px;
  width:92%;
  max-width:420px;
  box-shadow:0 4px 18px rgba(0,0,0,.12);
  text-align:center;
}

h2{
  font-size:28px;
  margin-bottom:20px;
  line-height:1.4;
}

.sub-title{
  display:block;
  font-size:16px;
  font-weight:normal;
  margin-top:8px;
  white-space:nowrap;
}

p{
  font-size:20px;
  line-height:1.8;
}

button{
  width:100%;
  padding:18px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:22px;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="box">
  <h2>
  銀河車旅｜商務接送
  <span class="sub-title">全車系皆提供專業西裝司機接待服務</span>
</h2>
  <p id="status">正在初始化...</p>
  <button onclick="start()" id="btn" disabled>進入表單</button>
</div>

<script>

let userId = "";

// ======================
// LIFF 初始化
// ======================
async function init(){

  try {

    await liff.init({ liffId: "2010005375-A5uCueCI" });

    // ❗ 沒登入 → 讓使用者點按鈕登入
    if (!liff.isLoggedIn()) {
      document.getElementById("status").innerText = "請點擊進入並登入 LINE";
      document.getElementById("btn").disabled = false;
      return;
    }

    const profile = await liff.getProfile();
    userId = profile.userId;

    document.getElementById("status").innerText = "已取得 LINE 帳號";
    document.getElementById("btn").disabled = false;

  } catch (err) {
    console.log(err);
    document.getElementById("status").innerText = "LIFF 初始化失敗";
  }
}

init();

// ======================
// 按鈕觸發（login + redirect）
// ======================
function start(){

  // 👉 如果沒登入，在這裡才 login
  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  const baseUrl =
    "https://docs.google.com/forms/d/e/1FAIpQLScVQDJs6h4xONJIxmMC_LNUHlcvbmj43xNGC4nVJZ0Cpjbs9w/viewform?usp=header";

  const url =
    baseUrl +
    "?usp=pp_url&entry.1037511777=" +
    encodeURIComponent(userId);

  window.location.href = url;
}

</script>

</body>
</html>
